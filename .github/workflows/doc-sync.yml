name: doc-sync
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Documentation Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            git diff --name-only "$BASE" "$HEAD" > /tmp/changed-files.txt
          else
            git diff --name-only HEAD~1 HEAD > /tmp/changed-files.txt
          fi
          echo "Changed files:"
          cat /tmp/changed-files.txt

      - name: Run doc-sync check
        id: docsync
        run: |
          # Read changed files into the script's argv (cap to avoid huge args).
          mapfile -t files < /tmp/changed-files.txt
          python3 .github/scripts/doc-sync.py "${files[@]:0:200}" || true
        continue-on-error: true

      - name: Annotate result (warning only, does not fail build)
        if: always()
        run: |
          echo "Documentation sync check completed. Missing doc updates are reported"
          echo "as warnings. Refer to .github/doc-mapping.yaml and AGENTS.md."
