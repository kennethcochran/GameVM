# Documentation Trigger Mapping
#
# Authoritative mapping between code changes and the documentation that MUST
# be updated when those code changes are made. This file is consumed by:
#   - AI agents working on the repo (see AGENTS.md)
#   - The doc-sync CI check (.github/workflows/doc-sync.yml)
#   - The /doc-sync skill
#
# Each entry lists code patterns (file globs, directory paths, or keywords)
# and the docs that must be synced. Keep this file in sync with AGENTS.md.

llir_instruction:
  code:
    - "src/GameVM.Compiler.Core/IR/LowLevelIR.cs"
    - "src/GameVM.Compiler.Core/IR/Enums/LlirInstructionKind.cs"
    - "src/GameVM.Compiler.Core/IR/LlirBuilder.cs"
  docs:
    - "docs/compiler/LLIR_ISA.md"
    - "docs/compiler/LLIR.md"

ir_construct:
  code:
    - "src/GameVM.Compiler.Core/IR/HighLevelIR.cs"
    - "src/GameVM.Compiler.Core/IR/MidLevelIR.cs"
    - "src/GameVM.Compiler.Core/IR/Transformers/"
    - "src/GameVM.Compiler.Core/IR/Slab/"
  docs:
    - "docs/compiler/HLIR.md"
    - "docs/compiler/MLIR.md"
    - "docs/compiler/LLIR.md"

backend_platform:
  code:
    - "src/GameVM.Compiler.Backend.*/"
  docs:
    - "docs/platforms/README.md"
    - "docs/platforms/specs/"
    - "docs/compiler/atari2600_implementation.md"

optimizer_pass:
  code:
    - "src/GameVM.Compiler.Optimizers.MidLevel/"
    - "src/GameVM.Compiler.Optimizers.LowLevel/"
  docs:
    - "docs/optimization.md"

frontend_language:
  code:
    - "src/GameVM.Compiler.Pascal/"
    - "src/GameVM.Compiler.CSharp/"
  docs:
    - "docs/compiler/Parser.md"
    - "docs/compiler/TypeSystem.md"
    - "docs/compiler/LanguageIntegration.md"

public_api:
  code:
    - "src/GameVM.Compiler.Core/Interfaces/"
    - "src/GameVM.Compiler.Core/Pipeline/"
    - "src/GameVM.Compiler.Application/Services/"
  docs:
    - "docs/api/"
  xml_doc: true

architecture_pipeline:
  code:
    - "src/GameVM.Compiler.Application/CompileUseCase.cs"
    - "src/GameVM.Compiler.Core/IR/Transformers/"
  docs:
    - "docs/architecture/ArchitectureOverview.md"
    - "docs/compiler/compiler_architecture.md"

dispatch_strategy:
  code:
    - "src/GameVM.Compiler.Core/Enums/DispatchStrategy.cs"
  docs:
    - "docs/code-generation.md"

capability_profile:
  code:
    - "src/GameVM.Compiler.Capabilities/"
    - "src/GameVM.Compiler.Application/Services/CapabilityValidatorService.cs"
  docs:
    - "docs/platforms/CapabilityProfiles.md"

build_tooling:
  code:
    - "GameVM.sln"
    - "Directory.Build.props"
    - "*.csproj"
  docs:
    - "docs/compiler/BuildSystem.md"

# Additional docs that must be checked when ANY code changes (catch-all)
always_check:
  - "docs/README.md"
  - "docs/TerminologyConsistencyReport.md"
